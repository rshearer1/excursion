<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excursion Grid</title>
  <style>
    :root {
      --bg: #0f1214; --surface: #171b1e; --border: #2a3136;
      --text: #e9ebe7; --muted: #97a1a7; --orange: #f08a2e; --cyan: #4ec9d4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
    }
    .wrap { max-width: 1020px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 18px; letter-spacing: 0.18em; margin: 0 0 2px; }
    h1 span { color: var(--cyan); }
    .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .drop {
      border: 1px dashed var(--border); border-radius: 8px; padding: 14px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px;
    }
    .drop.armed { border-color: var(--cyan); background: rgba(78,201,212,0.07); }
    button, select, input[type="number"] {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--cyan); }
    button.primary { border-color: var(--orange); color: var(--orange); font-weight: 600; }
    button:disabled { opacity: 0.4; cursor: default; }
    input[type="number"] { width: 84px; cursor: text; font-variant-numeric: tabular-nums; }
    label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
    canvas { width: 100%; height: 150px; display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: crosshair; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    .row .gap { flex: 1; }
    .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 110px; }
    .nudge button { padding: 7px 9px; font-variant-numeric: tabular-nums; }
    #status { color: var(--muted); font-size: 12px; min-height: 18px; margin-top: 8px; }
    #status.err { color: #e06c60; }
    kbd { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; }
    .hints { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>EXCURSION <span>GRID</span></h1>
    <div class="sub">phase 1 &mdash; beatgrid &amp; drive.json exporter</div>

    <div class="drop" id="drop">
      <input type="file" id="file" accept="audio/*" />
      <button id="demo" title="8 bars of 140 halftime kick/snare with the downbeat at 150 ms">Demo track (140)</button>
      <span id="trackname" style="color:var(--muted)">no track loaded</span>
    </div>

    <canvas id="wave" width="1960" height="300"></canvas>

    <div class="row">
      <button id="play" class="primary" disabled>Play</button>
      <span class="time" id="time">0:00.000 / 0:00.000</span>
      <label><input type="checkbox" id="metro" checked /> metronome</label>
      <span class="gap"></span>
      <label>mood
        <select id="mood">
          <option value="void">void</option>
          <option value="concrete">concrete</option>
          <option value="macro">macro</option>
          <option value="stack">stack</option>
          <option value="desk">desk</option>
        </select>
      </label>
      <button id="export" disabled>Export drive.json</button>
    </div>

    <div class="row">
      <label>BPM <input type="number" id="bpm" value="140" min="40" max="220" step="0.01" /></label>
      <button id="tap">TAP</button>
      <label>offset ms <input type="number" id="offset" value="0" step="1" /></label>
      <span class="nudge">
        <button data-nudge="-10">-10</button><button data-nudge="-1">-1</button><button data-nudge="1">+1</button><button data-nudge="10">+10</button>
      </span>
      <label><input type="checkbox" id="halftime" checked /> halftime</label>
      <label>beats/bar <input type="number" id="bpb" value="4" min="2" max="8" step="1" style="width:56px" /></label>
      <label>trim <input type="number" id="trim" value="1" min="0.1" max="3" step="0.05" style="width:64px" /></label>
    </div>

    <div id="status"></div>
    <div class="hints">
      <kbd>space</kbd> play/pause &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> nudge &plusmn;10 ms &nbsp; <kbd>shift</kbd>+<kbd>&larr;</kbd><kbd>&rarr;</kbd> &plusmn;1 ms &nbsp; click waveform to seek.<br />
      Orange lines are downbeats, cyan are beats. Grid right = metronome clicks disappear into the drums.
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
